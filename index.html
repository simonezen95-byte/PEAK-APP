<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>PEAK Functional Fitness</title>

    <!-- Aggiunta alla schermata Home: si apre a tutto schermo, senza la
         barra del browser, come un'app installata. Il manifest serve ad
         Android, i due "apple-" a iPhone e iPad. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="PEAK" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icona-192.png" type="image/png" />

    <!-- I font stanno in /public/fonts e partono dal nostro server, non da
         Google: caricarli da Google passa l'IP di chi apre l'app senza
         consenso (GDPR). Non rimettere i link a fonts.googleapis.com. -->
    <link rel="preload" href="/fonts/montserrat-var.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/barlow-700.woff" as="font" type="font/woff" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
